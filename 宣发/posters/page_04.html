<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px; height: 1660px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #f5f5f5;
    background: linear-gradient(160deg, #141e30 0%, #243b55 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 80px 72px; overflow: hidden;
  }
  .hero h1 { font-size: 84px; line-height: 1.3; font-weight: 800; }
  .hero h1 em { color: #f7971e; font-style: normal; }
  .hero .sub { font-size: 36px; line-height: 1.6; opacity: .85; margin-top: 28px; }
  .cmd {
    background: #0b1220; border: 2px solid #f7971e66; border-radius: 24px;
    padding: 44px 48px; display: flex; flex-direction: column; gap: 20px;
  }
  .cmd .label { font-size: 28px; color: #f7971e; letter-spacing: 4px; }
  .cmd code {
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 34px; line-height: 1.6; color: #38ef7d;
  }
  .meta { display: flex; flex-direction: column; gap: 20px; }
  .meta p { font-size: 34px; line-height: 1.55; }
  .meta .big {
    font-size: 44px; font-weight: 800; color: #f7971e;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 28px; opacity: .8;
  }
</style>
</head>
<body>
  <div class="hero">
    <h1>今晚就让它<em>替你守夜</em></h1>
    <p class="sub">Windows / macOS / Linux / 手机 Termux 都能跑，MIT 协议随便用。</p>
  </div>

  <div class="cmd">
    <span class="label">INSTALL &amp; RUN</span>
    <code>git clone limpidwei/quota-nanny<br>quota-nanny --probe "claude -p ping" --resume "claude --continue"</code>
  </div>

  <div class="meta">
    <p class="big">⭐ GitHub 搜 quota-nanny</p>
    <p>github.com/limpidwei/quota-nanny</p>
    <p>觉得有用就点个 Star，蹲到额度恢复的不只是你一个人。</p>
  </div>

  <div class="footer">
    <span>#AI工具 #开源 #vibecoding</span>
    <span>🌙</span>
  </div>
</body>
</html>
