<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px; height: 1660px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #f5f5f5;
    background: linear-gradient(160deg, #141e30 0%, #243b55 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 80px 72px; overflow: hidden;
  }
  .hero h1 { font-size: 80px; line-height: 1.3; font-weight: 800; }
  .hero h1 em { color: #f7971e; font-style: normal; }
  .steps { display: flex; flex-direction: column; gap: 32px; }
  .card {
    background: #ffffff10; border: 1px solid #ffffff26; border-radius: 24px;
    padding: 36px 40px; display: flex; align-items: center; gap: 32px;
  }
  .card .num {
    flex: none; width: 96px; height: 96px; border-radius: 24px;
    background: #f7971e; color: #141e30;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 800;
  }
  .card .body h3 { font-size: 40px; margin-bottom: 12px; }
  .card .body p { font-size: 32px; line-height: 1.55; opacity: .85; }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 28px; opacity: .8;
  }
  .footer .cta { color: #f7971e; font-weight: 700; }
</style>
</head>
<body>
  <div class="hero">
    <h1>三步<em>全自动</em><br>人不用醒着</h1>
  </div>

  <div class="steps">
    <div class="card">
      <div class="num">1</div>
      <div class="body">
        <h3>触发：撞墙自动唤醒</h3>
        <p>agent 日志一旦出现 usage limit / 403 / 429，watcher 自动拉起后台守护进程。</p>
      </div>
    </div>
    <div class="card">
      <div class="num">2</div>
      <div class="body">
        <h3>守候：每 30 分钟轻探测</h3>
        <p>只发一个最小请求确认额度状态，间隔和判定正则都可配，默认守 24 小时。</p>
      </div>
    </div>
    <div class="card">
      <div class="num">3</div>
      <div class="body">
        <h3>复活：恢复即续跑</h3>
        <p>探测成功 → 执行你的 resume 命令让 agent 接着干活 → 守护进程自己退出，不留残余。</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>PowerShell + bash 双版本</span>
    <span class="cta">怎么用 →</span>
  </div>
</body>
</html>
