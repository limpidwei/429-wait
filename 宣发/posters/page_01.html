<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1242px; height: 1660px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #f5f5f5;
    background: linear-gradient(160deg, #141e30 0%, #243b55 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 80px 72px; overflow: hidden;
  }
  .top-tags { display: flex; gap: 16px; flex-wrap: wrap; }
  .chip {
    background: #f7971e22; border: 2px solid #f7971e; border-radius: 999px;
    padding: 10px 28px; font-size: 26px; letter-spacing: 2px;
  }
  .hero { display: flex; flex-direction: column; gap: 40px; }
  .hero .kicker { font-size: 34px; color: #f7971e; letter-spacing: 8px; }
  .hero h1 { font-size: 92px; line-height: 1.3; font-weight: 800; }
  .hero h1 em { color: #f7971e; font-style: normal; }
  .hero .sub { font-size: 38px; line-height: 1.65; opacity: .88; max-width: 980px; }
  .moon {
    align-self: center; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffd166, #f7971e 70%);
    box-shadow: 0 0 120px #f7971e66;
    display: flex; align-items: center; justify-content: center;
    font-size: 110px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 28px; opacity: .8;
  }
  .footer .cta { color: #f7971e; font-weight: 700; }
</style>
</head>
<body>
  <div class="top-tags">
    <span class="chip">开源</span>
    <span class="chip">AI 工具</span>
    <span class="chip">MIT 协议</span>
  </div>

  <div class="hero">
    <div class="kicker">QUOTA-NANNY</div>
    <h1>凌晨撞限额<br>它替你<em>蹲到恢复</em></h1>
    <p class="sub">一个后台 shell 守护进程：AI 额度用尽自动守候，恢复后自动续跑任务。你去睡觉，活它来盯。</p>
  </div>

  <div class="moon">🌙</div>

  <div class="footer">
    <span>github.com/limpidwei/quota-nanny</span>
    <span class="cta">滑动查看 →</span>
  </div>
</body>
</html>
